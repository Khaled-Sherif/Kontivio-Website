version: '3.9'
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: kontivio
      POSTGRES_USER: kontivio
      POSTGRES_PASSWORD: kontiviopass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  web:
    build: .
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

  celery:
    build: .
    restart: always
    command: celery -A config worker -l info --concurrency 2
    env_file: .env
    depends_on:
      - db
      - redis
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

volumes:
  postgres_data:
